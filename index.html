<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hexventure</title>
    <meta name="description" content="Hexventure: build a hex world tile by tile, then walk into it and explore." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22%3E%3Cpath fill=%22%2358b83c%22 d=%22M12 2l8.66 5v10L12 22l-8.66-5V7z%22/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@600;700&display=swap" rel="stylesheet" />
  </head>
  <body data-mode="title">
    <!-- shown until the first frames are drawn (inline, so it appears before any script or stylesheet) -->
    <style>
      #loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: #a9dff0; transition: opacity 0.6s, visibility 0s 0.6s; }
      #loader .hx { width: 64px; height: 74px; background: #58b83c; clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%); animation: hxspin 1.1s ease-in-out infinite; }
      #loader p { margin: 18px 0 0; font: 700 15px system-ui, sans-serif; color: #fff; text-align: center; letter-spacing: 0.08em; text-shadow: 0 1px 4px rgba(0,0,0,0.25); }
      @keyframes hxspin { 50% { transform: rotate(60deg) scale(0.85); } 100% { transform: rotate(120deg); } }
      body.ready #loader { opacity: 0; visibility: hidden; }
      body:not(.ready) #hud, body:not(.ready) #title { visibility: hidden; }
    </style>
    <div id="loader"><div><div class="hx"></div><p>HEXVENTURE</p></div></div>
    <div id="app"></div>
    <div id="hud">
      <div id="vitals">
        <div id="hearts"></div>
        <div id="stamina"><i></i></div>
        <div id="flask"></div>
      </div>
      <div id="wallet"><span id="embers"></span><span id="fragments"></span></div>
      <div id="bossbar"></div>
      <div id="buildtitle">Build mode</div>
      <div id="hints"></div>
      <div id="prompt"></div>
      <div id="message"></div>
      <div id="banner"></div>
      <div id="tray"><div class="tray-head" id="buildnote"></div><div class="cards" id="hand"></div></div>
      <div id="stack"></div>
      <pre id="debug"></pre>
    </div>
    <div id="title">
      <div class="title-inner">
        <h1 class="logo"><span class="hex">H</span>exventure</h1>
        <p class="tag">Build a world tile by tile. Survive what lives there.</p>
        <nav id="title-nav"></nav>
        <button id="version" class="ver"></button>
      </div>
    </div>
    <div id="modal" class="hidden"><div class="card"></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
